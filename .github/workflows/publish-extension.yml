name: Publish extension (Python + npm)

# For Renglo-style extension repos. One tag publishes whichever trees exist:
#   package/pyproject.toml  →  Python wheel
#   ui/package.json         →  npm package
# Missing trees skip that job. Canonical copy: ops/publisher/workflows/publish-extension.yml
#
# Repository variables (same three for every publish workflow in this repo):
#   AWS_PUBLISH_ROLE_ARN
#   PUBLISHER_NAME            e.g. renglo  →  SSM /publisher/renglo/config
#   AWS_REGION
#
# Optional: PUBLISH_PUBLIC=true plus PYPI_API_TOKEN and NPM_TOKEN secrets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_public:
        description: Also publish to public PyPI and npmjs
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.layout.outputs.python }}
      npm: ${{ steps.layout.outputs.npm }}
    steps:
      - uses: actions/checkout@v4
      - id: layout
        run: |
          set -euo pipefail
          python=false
          npm=false
          if [ -f package/pyproject.toml ]; then
            python=true
          fi
          if [ -f ui/package.json ]; then
            npm=true
          fi
          echo "python=${python}" >> "$GITHUB_OUTPUT"
          echo "npm=${npm}" >> "$GITHUB_OUTPUT"
          echo "package/pyproject.toml: ${python}"
          echo "ui/package.json: ${npm}"
          if [ "${python}" = false ] && [ "${npm}" = false ]; then
            echo "Neither package/pyproject.toml nor ui/package.json found" >&2
            exit 1
          fi

  publish-python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Publish Python to CodeArtifact
        env:
          PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISHER_NAME:-}" ]; then
            echo "Set repository variable PUBLISHER_NAME (e.g. renglo)" >&2
            exit 1
          fi
          slug=$(printf '%s' "$PUBLISHER_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
          CONFIG_PARAM="/publisher/${slug}/config"
          CONFIG=$(aws ssm get-parameter --name "$CONFIG_PARAM" --query Parameter.Value --output text)
          DOMAIN=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["domain"])')
          REPO=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["python_repository"])')
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          python -m pip install --upgrade pip build twine
          aws codeartifact login --tool twine \
            --domain "$DOMAIN" \
            --domain-owner "$ACCOUNT" \
            --repository "$REPO"
          # Copy repo-root blueprints/ into package/<import>/blueprints/ (git layout unchanged).
          python3 <<'PY'
          from pathlib import Path
          import shutil
          root = Path(".")
          src = root / "blueprints"
          files = sorted(src.glob("*.json")) if src.is_dir() else []
          if not files:
              print("No repo-root blueprints/*.json; skipping stage")
              raise SystemExit(0)
          skip = {"tests", "test", "docs", "build", "dist"}
          dest_pkg = None
          for child in sorted((root / "package").iterdir()):
              if child.is_dir() and (child / "__init__.py").is_file() and child.name not in skip and not child.name.endswith(".egg-info"):
                  dest_pkg = child
                  break
          if dest_pkg is None:
              raise SystemExit("Could not find import package under package/")
          dest = dest_pkg / "blueprints"
          dest.mkdir(parents=True, exist_ok=True)
          for path in files:
              shutil.copy2(path, dest / path.name)
          print(f"Staged {len(files)} blueprint(s) into {dest}")
          PY
          python -m build package
          twine upload --repository codeartifact package/dist/*

      - name: Publish to public PyPI
        if: ${{ vars.PUBLISH_PUBLIC == 'true' || github.event.inputs.publish_public == 'true' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          twine upload package/dist/*

  publish-npm:
    needs: detect
    if: needs.detect.outputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Publish npm to CodeArtifact
        env:
          PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISHER_NAME:-}" ]; then
            echo "Set repository variable PUBLISHER_NAME (e.g. renglo)" >&2
            exit 1
          fi
          slug=$(printf '%s' "$PUBLISHER_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
          CONFIG_PARAM="/publisher/${slug}/config"
          CONFIG=$(aws ssm get-parameter --name "$CONFIG_PARAM" --query Parameter.Value --output text)
          DOMAIN=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["domain"])')
          REPO=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["npm_repository"])')
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          aws codeartifact login --tool npm \
            --domain "$DOMAIN" \
            --domain-owner "$ACCOUNT" \
            --repository "$REPO"
          cd ui
          npm pkg delete private || true
          npm publish --access restricted

      - name: Publish to public npmjs
        if: ${{ vars.PUBLISH_PUBLIC == 'true' || github.event.inputs.publish_public == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd ui
          npm pkg delete private || true
          npm config set registry https://registry.npmjs.org/
          npm publish --access public
