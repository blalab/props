name: Publish extension (Python + npm)

# For Renglo-style extension repos. One tag publishes whichever trees exist:
#   package/pyproject.toml  →  Python wheel
#   ui/package.json         →  npm package
# Missing trees skip that job. Copy this file to .github/workflows/publish-extension.yml
# in each product repo. Canonical copy: renglo-ops/samples/publish-extension.yml
#
# Repository variables (same three for every publish workflow in this repo):
#   AWS_PUBLISH_ROLE_ARN
#   PUBLISHER_NAME            e.g. apollo  →  SSM /publisher/apollo/config
#   AWS_REGION
#
# Optional: PUBLISH_PUBLIC=true plus PYPI_API_TOKEN and NPM_TOKEN secrets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_public:
        description: Also publish to public PyPI and npmjs
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.layout.outputs.python }}
      npm: ${{ steps.layout.outputs.npm }}
    steps:
      - uses: actions/checkout@v4
      - id: layout
        run: |
          set -euo pipefail
          python=false
          npm=false
          if [ -f package/pyproject.toml ]; then
            python=true
          fi
          if [ -f ui/package.json ]; then
            npm=true
          fi
          echo "python=${python}" >> "$GITHUB_OUTPUT"
          echo "npm=${npm}" >> "$GITHUB_OUTPUT"
          echo "package/pyproject.toml: ${python}"
          echo "ui/package.json: ${npm}"
          if [ "${python}" = false ] && [ "${npm}" = false ]; then
            echo "Neither package/pyproject.toml nor ui/package.json found" >&2
            exit 1
          fi

  publish-python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Publish Python to CodeArtifact
        env:
          PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISHER_NAME:-}" ]; then
            echo "Set repository variable PUBLISHER_NAME (e.g. renglo)" >&2
            exit 1
          fi
          slug=$(printf '%s' "$PUBLISHER_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
          CONFIG_PARAM="/publisher/${slug}/config"
          CONFIG=$(aws ssm get-parameter --name "$CONFIG_PARAM" --query Parameter.Value --output text)
          DOMAIN=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["domain"])')
          REPO=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["python_repository"])')
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          python -m pip install --upgrade pip build twine
          aws codeartifact login --tool twine \
            --domain "$DOMAIN" \
            --domain-owner "$ACCOUNT" \
            --repository "$REPO"
          # Repo-root blueprints/ stays out of the package tree. After the
          # build, those JSON files are added onto the wheel at
          # <import>/blueprints/ so an install can find them.
          python -m build package
          python3 <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import zipfile
          from pathlib import Path

          root = Path(".")
          files = sorted((root / "blueprints").glob("*.json")) if (root / "blueprints").is_dir() else []
          if not files:
              print("No repo-root blueprints/*.json; skipping wheel stage")
              raise SystemExit(0)
          wheels = sorted((root / "package" / "dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel built under package/dist")
          wheel_path = wheels[-1]
          skip = {"tests", "test", "docs", "build", "dist"}
          import_name = None
          for child in sorted((root / "package").iterdir()):
              if (
                  child.is_dir()
                  and (child / "__init__.py").is_file()
                  and child.name not in skip
                  and not child.name.endswith(".egg-info")
              ):
                  import_name = child.name
                  break
          if import_name is None:
              raise SystemExit("Could not find import package under package/")

          def file_hash(data: bytes) -> str:
              digest = hashlib.sha256(data).digest()
              return "sha256=" + base64.urlsafe_b64encode(digest).decode("ascii").rstrip("=")

          with zipfile.ZipFile(wheel_path) as zf:
              names = zf.namelist()
              record_name = next(name for name in names if name.endswith(".dist-info/RECORD"))
              payload = {name: zf.read(name) for name in names if name != record_name}
          staged = []
          for path in files:
              arc = f"{import_name}/blueprints/{path.name}"
              payload[arc] = path.read_bytes()
              staged.append(arc)
          buffer = io.StringIO()
          writer = csv.writer(buffer, lineterminator="\n")
          for arc in sorted(payload):
              data = payload[arc]
              writer.writerow([arc, file_hash(data), str(len(data))])
          writer.writerow([record_name, "", ""])
          record = buffer.getvalue().encode()
          tmp = wheel_path.with_suffix(".whl.tmp")
          with zipfile.ZipFile(tmp, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for arc in sorted(payload):
                  zf.writestr(arc, payload[arc])
              zf.writestr(record_name, record)
          tmp.replace(wheel_path)
          print(f"Staged {len(staged)} blueprint(s) onto {wheel_path.name}")
          PY
          twine upload --repository codeartifact package/dist/*

      - name: Publish to public PyPI
        if: ${{ vars.PUBLISH_PUBLIC == 'true' || github.event.inputs.publish_public == 'true' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          twine upload package/dist/*

  publish-npm:
    needs: detect
    if: needs.detect.outputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Publish npm to CodeArtifact
        env:
          PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISHER_NAME:-}" ]; then
            echo "Set repository variable PUBLISHER_NAME (e.g. renglo)" >&2
            exit 1
          fi
          slug=$(printf '%s' "$PUBLISHER_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
          CONFIG_PARAM="/publisher/${slug}/config"
          CONFIG=$(aws ssm get-parameter --name "$CONFIG_PARAM" --query Parameter.Value --output text)
          DOMAIN=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["domain"])')
          REPO=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["npm_repository"])')
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          aws codeartifact login --tool npm \
            --domain "$DOMAIN" \
            --domain-owner "$ACCOUNT" \
            --repository "$REPO"
          cd ui
          npm pkg delete private || true
          npm publish --access restricted

      - name: Publish to public npmjs
        if: ${{ vars.PUBLISH_PUBLIC == 'true' || github.event.inputs.publish_public == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd ui
          npm pkg delete private || true
          npm config set registry https://registry.npmjs.org/
          npm publish --access public
